[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcebridge"
version = "0.1.0"
description = "Preserve Source 1 / Garry's Mod content and make it usable again in s&box (Source 2)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "srctools>=2.7",
    "sourcepp>=2026.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sourcebridge = "sourcebridge.cli:main"

[tool.setuptools.packages.find]
include = ["sourcebridge*"]

[tool.setuptools.package-data]
sourcebridge = ["targets/sbox/templates/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
